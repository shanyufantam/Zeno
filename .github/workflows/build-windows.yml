name: Build Zeno for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.cjs"
      - "server.js"
      - "index.html"
      - "style.css"
      - "script.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Zeno-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
